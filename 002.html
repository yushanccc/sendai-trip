        .day-tab.active {

        }

        }
        @keyframes pika-wag {

        function openMap(lat, lng) {

        function openFullRoute() {
            const currentItems = itineraries[currentDay] || [];
            if (currentItems.length === 0) {
                alert("今天沒有排行程，皮卡丘不知道往哪走角！");
                return;
            }
            const origin = `${currentItems[0].lat},${currentItems[0].lng}`;
            const destination = `${currentItems[currentItems.length-1].lat},${currentItems[currentItems.length-1].lng}`;
            const waypoints = currentItems.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|');
            let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            if(waypoints) url += `&waypoints=${waypoints}`;
            window.open(url, '_blank');
        }

                            <span>${item.text}</span>
                        </label>
                        <button onclick="deleteTodoItem(${idx})" class="text-xs text-red-500 hover:underline font-bold">刪除</button>
                    </div>`;
            });
            updateGlobalWidgets();
        }

        function initNoteTabs() {
            const container = document.getElementById("noteDayTabs");
            container.innerHTML = "";
            datesArr.forEach(d => {
                const activeClass = (d === currentNoteDay) ? 'bg-amber-500 text-white font-bold' : 'bg-slate-100 text-slate-600';
                container.innerHTML += `<button class="px-3 py-1.5 rounded-xl text-xs transition-all ${activeClass}" onclick="switchNoteDay('${d}')">${d.substring(5)}</button>`;
            });
            document.getElementById("noteCurrentDateDisplay").innerText = currentNoteDay;
            document.getElementById("noteBox").value = notes[currentNoteDay] || "";
        }
        function switchNoteDay(day) {
            currentNoteDay = day;
            initNoteTabs();
        }
        function saveNoteData() {
            notes[currentNoteDay] = document.getElementById("noteBox").value;
            localStorage.setItem("pika_notes", JSON.stringify(notes));
            alert("⚡ 皮卡丘幫你把這天的備註藏好囉！儲存成功！");
        }

        function initExpenseSelect() {
            const select = document.getElementById("expDateSelect");
            select.innerHTML = "";
            datesArr.forEach(d => {
                select.innerHTML += `<option value="${d}">${d}</option>`;
            });
        }
        function addExpenseItem() {
            const date = document.getElementById("expDateSelect").value;
            const name = document.getElementById("expNameInput").value.trim();
            const amt = parseInt(document.getElementById("expAmtInput").value);
            if(!name || isNaN(amt)) return;
            expenses.push({ date: date, item: name, amount: amt });
            document.getElementById("expNameInput").value = "";
            document.getElementById("expAmtInput").value = "";
            localStorage.setItem("pika_expenses", JSON.stringify(expenses));
            renderExpense();
        }
        function deleteExpenseItem(idx) {
            expenses.splice(idx, 1);
            localStorage.setItem("pika_expenses", JSON.stringify(expenses));
            renderExpense();
        }
        function renderExpense() {
            const container = document.getElementById("expenseDayBreakdown");
            container.innerHTML = "";
            
            datesArr.forEach(day => {
                const dayExps = expenses.filter(e => e.date === day);
                let dayTotal = dayExps.reduce((sum, e) => sum + e.amount, 0);
                
                let html = `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                        <div class="flex justify-between items-center border-b pb-2 mb-2">
                            <span class="font-bold text-sm text-slate-700">📅 ${day}</span>
                            <span class="text-xs font-black text-amber-600">小計: ¥${dayTotal.toLocaleString()}</span>
                        </div>`;
                if(dayExps.length === 0) {
                    html += `<p class="text-xs text-slate-400 italic">本日無消費紀錄。</p>`;
                } else {
                    html += `<div class="space-y-2">`;
                    expenses.forEach((e, originalIdx) => {
                        if(e.date === day) {
                            html += `
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-slate-600 font-medium">${e.item}</span>
                                    <div class="flex items-center gap-3">
                                        <span class="font-bold text-slate-800">¥${e.amount.toLocaleString()}</span>
                                        <button onclick="deleteExpenseItem(${originalIdx})" class="text-red-400 hover:text-red-600 font-bold">✕</button>
                                    </div>
                                </div>`;
                        }
                    });
                    html += `</div>`;
                }
                html += `</div>`;
                container.innerHTML += html;
            });
            updateGlobalWidgets();
        }

        function renderAttractions() {
            const grid = document.getElementById("attractionGrid");
            grid.innerHTML = "";
            attractionData.forEach(item => {
                grid.innerHTML += `
                    <div class="card flex flex-col justify-between overflow-hidden border-4 ${item.cardClass} shadow-lg hover:scale-[1.02] transition-all duration-300 group">
                        <div>
                            <!-- Photo + Pokémon overlay -->
                            <div class="relative w-full h-52 rounded-2xl overflow-hidden mb-4">
                                <img src="${item.photoUrl}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
                                <!-- fallback gradient bg -->
                                <div style="display:none" class="absolute inset-0 flex items-center justify-center ${item.bgClass}">
                                    <span class="text-4xl opacity-30">${item.bgDecor}</span>
                                </div>
                                <!-- dark gradient overlay for text readability -->
                                <div class="absolute inset-0 bg-gradient-to-t from-black/65 via-black/10 to-transparent pointer-events-none"></div>
                                <!-- Pokémon overlay – smaller, sits bottom-right -->
                                <img src="${item.pikaImg}" alt="${item.pikaName}" 
                                     class="absolute bottom-1 right-2 w-20 h-20 object-contain drop-shadow-xl z-10 animate-pika-bounce 
                                            transition-transform duration-300 group-hover:scale-110" />
                                <!-- Pokémon name tag bottom-left -->
                                <div class="absolute bottom-2 left-3 bg-slate-900/80 text-yellow-300 text-[11px] px-2.5 py-1 rounded-full font-black tracking-wide border border-yellow-400/50 backdrop-blur-sm z-10">
                                    ${item.pikaName}
                                </div>
                            </div>
                            <h3 class="text-xl font-black text-slate-900 mb-2 flex items-center gap-1">🌟 ${item.title}</h3>
                            <p class="text-sm text-slate-800 font-medium leading-relaxed mb-4">${item.desc}</p>
                            
                            <div class="bg-white/70 backdrop-blur-xs p-4 rounded-xl border border-white/60 mb-3 text-xs text-slate-800 space-y-2 shadow-sm">
                                <span class="font-black text-slate-900 block text-sm border-b pb-1">✨ 必看與體驗亮點：</span>
                                <div class="leading-relaxed">${item.highlight}</div>
                            </div>
                        </div>
                        <div class="text-[11px] text-slate-600 border-t border-slate-900/10 pt-3 mt-2 font-bold leading-relaxed">
                            ${item.info}
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
