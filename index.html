<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>仙台皮卡丘旅行 App ⚡</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #fffdf2;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.btn {
  background: #ffd84d;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.btn:hover { background: #ffcc00; }

.tab {
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid #ddd;
  cursor: pointer;
}

.tab.active {
  background: #ffd84d;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="max-w-5xl mx-auto p-4 space-y-4">

<!-- HEADER -->
<div class="card">
  <h1 class="text-2xl font-black">⚡ 仙台皮卡丘旅行 App</h1>
  <div>2026/05/21 - 2026/05/25</div>
</div>

<!-- TABS -->
<div id="tabs" class="flex gap-2 flex-wrap"></div>

<!-- ITINERARY -->
<div class="card">
  <h2 class="font-bold text-lg mb-2">📅 行程</h2>

  <button class="btn mb-3" onclick="openFullRoute()">
    🗺 一鍵整天路線導航
  </button>

  <div id="itineraryList" class="space-y-2"></div>
</div>

<!-- NOTES -->
<div class="card">
  <h2 class="font-bold text-lg mb-2">📝 旅遊備註</h2>

  <textarea id="noteBox"
    class="w-full border p-2 rounded"
    rows="4"
    placeholder="寫下今天的旅遊心得..."></textarea>

  <button class="btn mt-2" onclick="saveNote()">儲存備註</button>

  <div id="savedNote" class="mt-3 text-gray-700"></div>
</div>

<!-- PHOTO -->
<div class="card">
  <h2 class="font-bold text-lg mb-2">📷 照片記錄</h2>

  <input type="file" accept="image/*" onchange="uploadPhoto(event)" />

  <div id="photoArea" class="grid grid-cols-2 gap-2 mt-3"></div>
</div>

<!-- EXPENSE -->
<div class="card">
  <h2 class="font-bold text-lg mb-2">💰 記帳</h2>

  <input id="name" placeholder="項目" class="border p-2 w-full mb-2"/>
  <input id="amount" type="number" placeholder="金額" class="border p-2 w-full mb-2"/>

  <button class="btn w-full" onclick="addExpense()">新增</button>

  <div id="expenseList" class="mt-3 space-y-2"></div>
</div>

</div>

<script>

/* =========================
   行程資料
========================= */
let itineraries = JSON.parse(localStorage.getItem("plan")) || {
"2026/05/21":[
  {name:"抵達仙台",lat:38.26,lng:140.88},
  {name:"仙台站",lat:38.26,lng:140.88}
],
"2026/05/22":[
  {name:"仙台朝市",lat:38.26,lng:140.88},
  {name:"瑞鳳殿",lat:38.25,lng:140.86}
],
"2026/05/23":[
  {name:"金蛇水神社",lat:38.06,lng:140.85},
  {name:"松島",lat:38.37,lng:141.06}
],
"2026/05/24":[
  {name:"一ノ関",lat:38.93,lng:141.13},
  {name:"猊鼻渓",lat:38.98,lng:141.29}
],
"2026/05/25":[
  {name:"仙台購物",lat:38.26,lng:140.88},
  {name:"機場",lat:38.14,lng:140.92}
]
};

let currentDay = Object.keys(itineraries)[0];

function savePlan(){
localStorage.setItem("plan",JSON.stringify(itineraries));
}

/* =========================
   Tabs
========================= */
function renderTabs(){
const tabs=document.getElementById("tabs");
tabs.innerHTML="";

Object.keys(itineraries).forEach(d=>{
tabs.innerHTML+=`
<div class="tab ${d===currentDay?'active':''}" onclick="switchDay('${d}')">
${d}
</div>`;
});
}

function switchDay(d){
currentDay=d;
renderAll();
}

/* =========================
   行程
========================= */
function renderItinerary(){
const box=document.getElementById("itineraryList");
box.innerHTML="";

itineraries[currentDay].forEach((p,i)=>{
box.innerHTML+=`
<div class="card flex justify-between items-center" data-index="${i}">
<div>${p.name}</div>

<div class="flex gap-2">
<button class="btn" onclick="openMap(${p.lat},${p.lng})">導航</button>
</div>
</div>`;
});

enableDrag();
}

/* Google Maps */
function openMap(lat,lng){
window.open(
`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=transit`,
"_blank");
}

/* 一鍵整天路線 */
function openFullRoute(){
let points=itineraries[currentDay];
if(points.length<2)return;

let origin=`${points[0].lat},${points[0].lng}`;
let dest=`${points[points.length-1].lat},${points[points.length-1].lng}`;

let waypoints=points.slice(1,-1)
.map(p=>`${p.lat},${p.lng}`).join("|");

let url=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=transit&waypoints=${waypoints}`;

window.open(url,"_blank");
}

/* 拖拉 */
function enableDrag(){
new Sortable(document.getElementById("itineraryList"),{
animation:150,
onEnd:()=>{
let arr=[];
document.querySelectorAll("[data-index]").forEach(el=>{
arr.push(itineraries[currentDay][el.dataset.index]);
});
itineraries[currentDay]=arr;
savePlan();
renderItinerary();
}
});
}

/* =========================
   備註
========================= */
function saveNote(){
localStorage.setItem("note-"+currentDay,
document.getElementById("noteBox").value);

loadNote();
}

function loadNote(){
document.getElementById("noteBox").value=
localStorage.getItem("note-"+currentDay)||"";

document.getElementById("savedNote").innerText=
localStorage.getItem("note-"+currentDay)||"";
}

/* =========================
   照片
========================= */
function uploadPhoto(e){
let file=e.target.files[0];
let reader=new FileReader();

reader.onload=function(){
let photos=JSON.parse(localStorage.getItem("photo-"+currentDay)||"[]");
photos.push(reader.result);
localStorage.setItem("photo-"+currentDay,JSON.stringify(photos));
renderPhotos();
};

reader.readAsDataURL(file);
}

function renderPhotos(){
let photos=JSON.parse(localStorage.getItem("photo-"+currentDay)||"[]");
let box=document.getElementById("photoArea");
box.innerHTML="";

photos.forEach(p=>{
box.innerHTML+=`<img src="${p}" class="rounded-xl"/>`;
});
}

/* =========================
   記帳
========================= */
let expenses=[];

function addExpense(){
let n=document.getElementById("name").value;
let a=parseInt(document.getElementById("amount").value);

if(!n||!a)return;

expenses.push({n,a});

renderExpense();
}

function renderExpense(){
let box=document.getElementById("expenseList");
box.innerHTML="";
let total=0;

expenses.forEach(e=>{
total+=e.a;
box.innerHTML+=`<div>${e.n} - ¥${e.a}</div>`;
});

box.innerHTML+=`<div class="font-bold">總計 ¥${total}</div>`;
}

/* =========================
   init
========================= */
function renderAll(){
renderTabs();
renderItinerary();
loadNote();
renderPhotos();
renderExpense();
}

renderAll();

</script>

</body>
</html>
