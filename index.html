<body class="pb-12">

</div>

let currentDay = Object.keys(itineraries)[0];
let currentNoteDay = Object.keys(itineraries)[0];
let currentExpDay = Object.keys(itineraries)[0];
let itineraryMode = "single";

let todos = JSON.parse(localStorage.getItem("todo")) || ["確認日本網卡", "準備媽媽的慶生驚喜小卡"];
let shops = JSON.parse(localStorage.getItem("shop")) || ["皮卡丘仙台限定娃娃", "毛豆泥麻糬伴手禮"];
let expenses = JSON.parse(localStorage.getItem("expenses")) || [
  { day: "2026/05/21", name: "伊達牛舌晚餐", amt: 5500 },
  { day: "2026/05/22", name: "瑞鳳殿門票", amt: 1140 }
];

/* =========================
  TAB SWITCHER LOGIC
========================= */
function switchMainTab(tabId) {
  document.querySelectorAll('.main-section').forEach(el => el.classList.add('hidden'));
  document.getElementById(tabId).classList.remove('hidden');
  
  document.querySelectorAll('.main-tab').forEach(btn => {
    if(btn.getAttribute('data-target') === tabId) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

/* =========================
  ITINERARY MANAGEMENT
========================= */
function setItineraryMode(mode) {
  itineraryMode = mode;
  document.getElementById('btn-mode-single').classList.toggle('opacity-60', mode !== 'single');
  document.getElementById('btn-mode-all').classList.toggle('opacity-60', mode !== 'all');
  renderItinerary();
}

function renderDateTabs() {
  const iTabs = document.getElementById("itinerary-date-tabs");
  const nTabs = document.getElementById("note-date-tabs");
  
  iTabs.innerHTML = "";
  nTabs.innerHTML = "";
  
  Object.keys(itineraries).forEach(d => {
    // Itinerary Tabs
    iTabs.innerHTML += `
      <button class="day-tab ${d === currentDay && itineraryMode === 'single' ? 'active' : ''}" 
        onclick="currentDay='${d}'; itineraryMode='single'; setItineraryMode('single'); renderDateTabs();">
        ${d.substring(5)}
      </button>`;
      
    // Note Tabs
    nTabs.innerHTML += `
      <button class="day-tab ${d === currentNoteDay ? 'active' : ''}" 
        onclick="currentNoteDay='${d}'; loadNoteForDay();">
        ${d.substring(5)}
      </button>`;
  });
}

function renderItinerary() {
  const box = document.getElementById("itinerary-list");
  box.innerHTML = "";

  if (itineraryMode === "all") {
    Object.keys(itineraries).forEach(day => {
      box.innerHTML += `
        <div class="font-black text-lg text-blue-800 mt-4 flex items-center gap-2">
          <span>🔴</span> ${day} 行程總覽
        </div>`;
      itineraries[day].forEach(p => {
        box.innerHTML += `
          <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
            <span class="font-bold text-slate-700">⚡ ${p.name}</span>
            <button class="btn-pika py-1 px-3 text-xs" onclick="openMap(${p.lat},${p.lng})">導航</button>
          </div>`;
      });
    });
    return;
  }

  // Single Day Mode
  itineraries[currentDay].forEach((p, i) => {
    box.innerHTML += `
      <div class="bg-white p-4 rounded-xl border-2 border-amber-200 shadow-sm flex justify-between items-center cursor-move group" data-index="${i}">
        <div class="flex items-center gap-3">
          <span class="bg-amber-400 text-xs px-2 py-1 rounded font-black text-amber-900">${i+1}</span>
          <span class="font-bold text-slate-800 group-hover:text-blue-700">${p.name}</span>
        </div>
        <button class="btn-pika py-1 px-4 text-xs" onclick="openMap(${p.lat},${p.lng})">📍 導航</button>
      </div>`;
  });

  enableDrag();
}

function enableDrag() {
  const el = document.getElementById("itinerary-list");
  if(!el || itineraryMode === 'all') return;
  
  Sortable.create(el, {
    animation: 150,
    ghostClass: 'bg-yellow-50',
    onEnd: () => {
      let newArr = [];
      el.querySelectorAll('[data-index]').forEach(item => {
        const idx = parseInt(item.getAttribute('data-index'));
        newArr.push(itineraries[currentDay][idx]);
      });
      itineraries[currentDay] = newArr;
      localStorage.setItem("plan", JSON.stringify(itineraries));
      renderItinerary(); // Re-render to update the indices
    }
  });
}

function openMap(lat, lng) {
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=transit`, "_blank");
}

function openFullRoute() {
  let arr = itineraries[currentDay];
  if(arr.length === 0) return;
  let o = arr[0], d = arr[arr.length - 1];
  let w = arr.slice(1, -1).map(p => p.lat + "," + p.lng).join("|");
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}&waypoints=${w}`, "_blank");
}

/* =========================
  TODO MANAGEMENT
========================= */
function addTodo() {
  let v = document.getElementById("todoInput").value.trim();
  if (!v) return;
  todos.push(v);
  localStorage.setItem("todo", JSON.stringify(todos));
  document.getElementById("todoInput").value = "";
  renderTodo();
}

function renderTodo() {
  let box = document.getElementById("todoList");
  box.innerHTML = "";
  todos.forEach((t, i) => {
    box.innerHTML += `
      <div class="bg-white px-4 py-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
        <span class="font-medium text-slate-700">🔹 ${t}</span>
        <button class="text-red-500 hover:text-red-700 font-bold px-2" onclick="delTodo(${i})">❌</button>
      </div>`;
  });
}

function delTodo(i) {
  todos.splice(i, 1);
  localStorage.setItem("todo", JSON.stringify(todos));
  renderTodo();
}

/* =========================
  SHOPPING MANAGEMENT
========================= */
function addShop() {
  let v = document.getElementById("shopInput").value.trim();
  if (!v) return;
  shops.push(v);
  localStorage.setItem("shop", JSON.stringify(shops));
  document.getElementById("shopInput").value = "";
  renderShop();
}

function renderShop() {
  let box = document.getElementById("shopList");
  box.innerHTML = "";
  shops.forEach((s, i) => {
    box.innerHTML += `
      <div class="bg-white px-4 py-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
        <span class="font-medium text-slate-700">🛍️ ${s}</span>
        <button class="text-red-500 hover:text-red-700 font-bold px-2" onclick="delShop(${i})">❌</button>
      </div>`;
  });
}

function delShop(i) {
  shops.splice(i, 1);
  localStorage.setItem("shop", JSON.stringify(shops));
  renderShop();
}

/* =========================
  DAILY NOTES LOGIC
========================= */
function loadNoteForDay() {
  renderDateTabs();
  document.getElementById("noteBox").value = localStorage.getItem("note-" + currentNoteDay) || "";
}

function saveNote() {
  let val = document.getElementById("noteBox").value;
  localStorage.setItem("note-" + currentNoteDay, val);
  alert(`⚡ ${currentNoteDay} 備註儲存成功！`);
}

/* =========================
  EXPENSE LOGIC
========================= */
function initExpenseDropdown() {
  const select = document.getElementById("expDaySelect");
  select.innerHTML = "";
  Object.keys(itineraries).forEach(day => {
    select.innerHTML += `<option value="${day}">${day}</option>`;
  });
  select.value = currentExpDay;
  select.addEventListener('change', (e) => {
    currentExpDay = e.target.value;
    renderExpenses();
  });
}

function addExpense() {
  let name = document.getElementById("expName").value.trim();
  let amt = parseInt(document.getElementById("expAmt").value);
  if (!name || isNaN(amt)) return;

  expenses.push({ day: currentExpDay, name, amt });
  localStorage.setItem("expenses", JSON.stringify(expenses));
  
  document.getElementById("expName").value = "";
  document.getElementById("expAmt").value = "";
  renderExpenses();
}

function delExpense(i) {
  expenses.splice(i, 1);
  localStorage.setItem("expenses", JSON.stringify(expenses));
  renderExpenses();
}

function renderExpenses() {
  let box = document.getElementById("expList");
  box.innerHTML = "";
  
  let dayTotal = 0;
  let allTotal = 0;

  expenses.forEach((e, idx) => {
    allTotal += e.amt;
    if (e.day === currentExpDay) {
      dayTotal += e.amt;
      box.innerHTML += `
        <div class="bg-white px-4 py-2 rounded-xl border border-gray-200 flex justify-between items-center text-sm shadow-sm">
          <span class="font-bold text-slate-700">${e.name}</span>
          <div class="flex items-center gap-3">
            <span class="font-black text-amber-600">¥${e.amt.toLocaleString()}</span>
            <button class="text-xs text-red-400 hover:text-red-600 font-bold" onclick="delExpense(${idx})">刪除</button>
          </div>
        </div>`;
    }
  });

  if(box.innerHTML === "") {
    box.innerHTML = `<div class="text-xs text-gray-400 italic py-2">本日尚無花費記錄</div>`;
  }

  document.getElementById("day-total-box").innerText = `¥ ${dayTotal.toLocaleString()}`;
  document.getElementById("all-total-box").innerText = `¥ ${allTotal.toLocaleString()}`;
}

      <p class="text-xs font-medium opacity-80 mt-1">專為本次初夏散策與媽媽隨行深度客製的圖文指南</p>

/* =========================
  INITIALIZATION
========================= */
function initAll() {
  renderDateTabs();
  renderItinerary();
  renderTodo();
  renderShop();
  loadNoteForDay();
  initExpenseDropdown();
  renderExpenses();
  renderSpotsGuide();
}

// Fire!
initAll();
</script>
