: 500}, {"text": "扭蛋小物", "done": false, "price": 400}, {"text": "日本限定環保袋", "done": false, "price": 1200}, {"text": "藥妝店退稅補貨包", "done": false, "price": 3000}]}], "todos": {"before": [{"text": "確認護照效期大於六個月", "done": true}, {"text": "投保旅遊平安險與不便險", "done": false}, {"text": "填寫 Visit Japan Web 並截圖 QR Code", "done": false}, {"text": "確認星宇航空航班與行李額度", "done": false}, {"text": "準備日幣現金與信用卡", "done": false}, {"text": "確認飯店訂房與早餐資訊", "done": false}], "during": [{"text": "每天出門前確認手機、行動電源、護照影本", "done": false}, {"text": "晚上回飯店記帳與整理購物清單", "done": false}, {"text": "確認隔天交通時間與天氣", "done": false}, {"text": "每天幫媽媽確認休息時間與水分補充", "done": false}], "return": [{"text": "確認回程 JX863 報到時間", "done": false}, {"text": "S-PAL 伴手禮最後補貨", "done": false}, {"text": "確認液體、電池與托運限制", "done": false}, {"text": "確認護照、錢包、手機、免稅品都帶齊", "done": false}], "luggage": [{"text": "護照、機票/訂房截圖、旅遊保險資料", "done": false}, {"text": "日幣現金、信用卡、IC 卡", "done": false}, {"text": "手機、充電線、行動電源、轉接頭", "done": false}, {"text": "常備藥、腸胃藥、止痛藥、暈車藥", "done": false}, {"text": "保暖外套、好走鞋、雨傘或輕便雨衣", "done": false}, {"text": "化妝保養品、卸妝用品、防曬", "done": false}, {"text": "購物用環保袋、壓縮袋、行李秤", "done": false}]}, "attractions": [{"title": "AER 展望テラス", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/TRuwqlAElxPmphFCr8XC.jpg", "desc": "AER 大樓 31 樓的展望台提供了最寬廣的視角。這裡與收費展望台不同，氣氛更加安靜且自由。您可以從這裡俯瞰整個仙台站繁忙的鐵道網路，看著東北新幹線像一道道白色的箭矢劃過大地。遠方的泉岳與海邊都能一覽無遺。", "recommend": "南、北兩側截然不同的城市面貌，一邊是密集的站前商圈，一邊是綿延至山巒的杜之都景致。", "address": "宮城縣仙台市青葉區中央1-3-1 (31樓)", "hours": "10:00 - 20:00", "map": "https://www.google.com/maps/search/?api=1&query=AER%E5%B1%95%E6%9C%9B%E5%8F%B0"}, {"title": "仙台朝市", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/tQfQzsbecxElpEOhUskF.jpg", "desc": "被譽為「仙台的廚房」，是感受這座城市生命力最好的起點。早晨 8:30 踏入這條僅百公尺長的窄巷，迎接你的是嘹亮的叫賣聲與充滿活力的色彩。5 月下旬正是東北水果交替的時節，幸運的話能遇見香氣馥郁的宮城縣產草莓，或是正要上市的紅艷櫻桃。這裡不僅是買賣，更是一種在地生活的縮影。", "recommend": "「齋藤惣菜店」買一塊外脆內綿的現炸可樂餅，那是仙台人從小到大的記憶。「朝市丼」挑選她喜愛的鮮魚食材，拼成一碗獨一無二的海鮮丼。", "address": "宮城縣仙台市青葉區中央4-3-28", "hours": "08:00 - 18:00（多數店家週日公休）", "map": "https://www.google.com/maps/search/?api=1&query=%E4%BB%99%E5%8F%B0%E6%9C%9D%E5%B8%82"}, {"title": "地底の森博物館", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/OLovtaCOw0UFyjT7wmoF.jpg", "desc": "建立在考古遺址上的博物館，踏入展廳那一刻，燈光轉暗，眼前的景象會讓人屏息。這裡完整保存了兩萬年前冰河時期的森林遺跡。巨大的樹木根部盤根錯節，彷彿時間在那一刻凝固了。這種寂靜、深邃的氛圍，能讓心境瞬間平靜下來，是母女對話、分享人生感悟的絕佳場所。", "recommend": "必看的是現場保存的舊石器時代人類篝火遺跡，這不僅是考古，更是人類文明溫度的傳承。走出博物館，前往戶外的「冰河期之森」公園，那裡復原了兩萬年前的植被。", "address": "宮城縣仙台市太白區長町南4-3-1", "hours": "09:00 - 16:45 (週一及例假日隔日休)", "map": "https://www.google.com/maps/search/?api=1&query=%E5%9C%B0%E5%BA%95%E3%81%AE%E6%A3%AE%E5%8D%9A%E7%89%A9%E9%A4%A8"}, {"title": "瑞鳳殿", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/5cPNKuqQZuVdo99pqKXN.jpg", "desc": "仙台藩祖伊達政宗的靈廟，其建築風格承襲了安土桃山時代的極致奢華。整座建築以漆黑、明金與鮮紅交織，在茂密的百年杉木林中若隱若現，展現出一種莊嚴卻不失絢麗的美感。5 月的陽光透過高聳的杉葉灑下光影，照亮了建築上精細的浮雕，讓人驚嘆於古人的工藝水準。", "recommend": "必看的是天頂與廊柱上的華麗裝飾，每一處都有故事。必做的是在入口處的資料館觀看紀錄片，了解這座建築如何在二戰毀損後浴火重生，這份韌性也是仙台精神的象徵。", "address": "宮城縣仙台市青葉區靈屋下23-2", "hours": "09:00 - 16:50", "map": "https://www.google.com/maps/search/?api=1&query=%E7%91%9E%E9%B3%B3%E6%AE%BF"}, {"title": "仙台城跡", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/0pL8NDDu9icNUtBhF85c.jpg", "desc": "來到仙台，如果不登上青葉山，就無法理解「杜之都」（森林之都）的美名。\n雖然城堡主體已不復存在，但現存的巨大石垣依然述說著當年的雄偉。這裡最著名的便是伊達政宗跨馬巡視領地的雕像，他那獨眼的堅毅神情，彷彿在數百年後依然守護著這座城市。5 月的海風從太平洋吹來，站在展望台上視野極佳。", "recommend": "必看的是夕陽西下前，整個仙台市區與遠方海平線交融的壯闊景象。必做的是在販賣部買一份仙台名物「毛豆泥麻糬」（Zunda Mochi）。", "address": "宮城縣仙台市青葉區川內1", "hours": "遺址區全天開放 (資料館 09:00 - 17:00)", "map": "https://www.google.com/maps/search/?api=1&query=%E4%BB%99%E5%8F%B0%E5%9F%8E%E8%B7%A1"}, {"title": "金蛇水神社", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/AXSKHjCMwOYbvgn5uJWj.jpg", "desc": "這是一座充滿靈動感的神社，主祭神為「金蛇」，是祈求財運、商賣繁盛與開運的名所。5 月下旬正是這裡一年中最美的時刻，神社內的紫藤花與牡丹花節正好接近尾聲或高峰。大片的紫藤如瀑布般從花架垂下，與園內的石景、流水相映成趣。這裡不僅是參拜，更像是一座修整精緻的日式庭園。", "recommend": "必看的是神社各處巧妙隱藏的「蛇形石」，撫摸這些石頭以祈求好運，拿著錢包觸摸蛇紋石據說可以招財，記得洗鈔當錢母，買黃金御守、黃金鹽。推薦去附設「Sanda Terrace」，這裡的建築與神社景觀完美融合，推薦點一杯特製咖啡與蛇型麵包。", "address": "宮城縣岩沼市三色吉字水神168", "hours": "全天開放 (社務所 08:30 - 16:00)", "map": "https://www.google.com/maps/search/?api=1&query=%E9%87%91%E8%9B%87%E6%B0%B4%E7%A5%9E%E7%A4%BE"}, {"title": "松島", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/imFdvPSwMpqyCc5oPu7n.jpg", "desc": "松島海岸不僅是地理座標，更是日本千年歷史的縮影。當您步出車站，迎面而來的是帶著鹹味的清爽海風與松樹的清香。由於您與媽媽選擇不搭船，這片區域的「陸地散策」將會非常精采。這裡的步道圍繞著灣岸建設，一側是星羅棋布的 260 餘座小島，一側是國寶級的古剎與茶室。5 月下旬，岸邊的松葉正是翠綠欲滴，陽光在平靜如鏡的海面上折射出寶石般的光澤。", "recommend": "「五大堂 (Godaido)」是松島的象徵，連結五大堂的「紅漆透橋」刻意設計了縫隙，讓人在行走時低頭能見到腳底的海水，寓意「修行時需屏除雜念」。\n「觀瀾亭 (Kanrantei)」曾是伊達政宗的茶室，推薦體驗是坐進面向松島灣的塌塌米席，點一份抹茶與毛豆泥甜點。\n松島的牡蠣舉世聞名，必做體驗是步行至附近的「牡蠣小屋」，看著碩大飽滿的牡蠣在火爐上嘶嘶作響，那股鮮甜的香氣將成為這趟旅行最深刻的味覺記憶。", "address": "宮城縣宮城郡松島町松島町內", "hours": "全天開放（五大堂至 16:00；觀瀾亭 08:30 - 17:00）", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%BE%E5%B3%B6%E6%B5%B7%E5%B2%B8"}, {"title": "福浦島", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/BppvDXW32PXVaLCoQD91.jpg", "desc": "如果說松島海岸是熱鬧的舞台，那麼「福浦島」就是一座漂浮在海上的私人花園。這座島嶼透過長達 252 公尺的「福浦橋」與陸地相連。由於該橋是紅色的，在藍天綠島的映襯下顯得格外奪目，被譽為「相遇之橋」。對於體力好的媽媽來說，福浦島提供了一種「完全沉浸」的步行感受，遠離了觀光大街的嘈雜，取而代之的是海鳥的鳴叫與林間的蟬鳴。環島大約40-50分鐘。", "recommend": "福浦橋 (Fukuura Bridge)是不搭船也能近距離觀測松島灣的最佳方式。走在橋上，左右兩側完全無遮蔽，那種海天一色的開闊感非常壯觀。\n見晴台 (Miharashi Pavilion)可以平視松島灣最核心的島嶼群，視野完全不輸給觀光船。", "address": "宮城縣宮城郡松島町松島仙隨 30-1", "hours": "08:00 - 17:00 (11月至2月至 16:30)", "map": "https://share.google/4SvyWvjnh8N9UalGa"}, {"title": "猊鼻渓", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/eeVWwOswr6w2s74dNETr.jpg", "desc": "猊鼻溪的魅力在於它的「慢」。這裡是日本少數全程不使用馬達，完全由船夫以長篙手搖前行的溪谷。高達百公尺的絕壁矗立在河流兩側，隨著船夫嘹亮的「追分」歌聲，彷彿穿梭回古代日本。5 月初夏，兩岸的岩壁上掛著點點綠意，溪水清澈得可以看見魚群。", "recommend": "必看是壯麗的「大龍鼻」岩壁，形狀奇特讓人感嘆大自然的神工鬼斧。必做的是在航程終點下船後，購買「運玉」（刻有運、緣、願、壽等字的石玉），嘗試將它投入對岸岩壁的小洞中。如果投中了，據說願望就會成真。", "address": "岩手縣一關市東山町長坂字町467", "hours": "08:30 - 16:00 (依船班)", "map": "https://share.google/drgnmcrJBDiew1det"}, {"title": "定禅寺通", "photo": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/blHpv7FOY26tzdcWdrrk/pub/CIXTVCKR8F3w6v8hv530.jpg", "desc": "定禪寺通是仙台作為「杜之都」的名片。這條寬廣的街道中央規劃了步行專屬的林蔭步道，兩側種植了 166 棵巨大的櫸木。5 月下旬，新綠已然茂密，形成了一道天然的綠色隧道。陽光穿過層層疊疊的綠葉，在地面撒下跳動的金色光斑，走在其中，城市的吵雜聲彷彿被樹葉過濾掉了，只剩風聲與腳步聲。", "recommend": "必看的是散佈在步道中央的青銅雕塑，如著名的《夏之母》，這些藝術品賦予了這條街濃厚的文化底蘊。必做的是在步道邊的咖啡座喝杯午茶，看著仙台市民在樹蔭下悠閒行走。", "address": "宮城縣仙台市青葉區國分町附近", "hours": "全天開放", "map": "https://www.google.com/maps/search/?api=1&query=%E5%AE%9A%E7%A6%AA%E5%AF%BA%E9%80%9A"}], "todayMain": {"2026/05/21": "前往仙台看夜景", "2026/05/22": "仙台朝市、地底之森博物館、仙台市區景點及逛街", "2026/05/23": "金蛇水神社、松島、仙台駅前逛街", "2026/05/24": "POKÉMON with YOU 列車", "2026/05/25": "定禪寺通"}, "todayMeal": {"2026/05/21": "晚餐-地酒和鮮 蔵の庄", "2026/05/22": "早餐-飯店、午餐-梅の花、晚餐-仙台駅", "2026/05/23": "早餐-飯店、午餐-松島吃牡蠣、晚餐-仙台駅", "2026/05/24": "早餐-仙台駅、午餐-蕎麥麵、晚餐-商店街", "2026/05/25": "看心情😊"}, "weather": ["5/21 🌧️ 雨 12°/16°", "5/22 🌧️ 雨 9°/14°", "5/23 🌦️ 小雨 8°/16°", "5/24 ⛈️ 雷雨 11°/20°", "5/25 🌤️ 多雲 13°/22°"]};
let datesArr=Object.keys(DATA.itineraries);let currentDay=datesArr[0],currentNoteDay=datesArr[0];let itineraries=JSON.parse(localStorage.getItem('pika_plan'))||DATA.itineraries;let notes=JSON.parse(localStorage.getItem('pika_notes'))||DATA.notes;let expenses=JSON.parse(localStorage.getItem('pika_expenses'))||DATA.expenses;let shops=JSON.parse(localStorage.getItem('pika_shop'))||DATA.shops;let todos=JSON.parse(localStorage.getItem('pika_todo'))||DATA.todos;if(Array.isArray(todos))todos=DATA.todos;function saveAll(){localStorage.setItem('pika_plan',JSON.stringify(itineraries));localStorage.setItem('pika_notes',JSON.stringify(notes));localStorage.setItem('pika_expenses',JSON.stringify(expenses));localStorage.setItem('pika_shop',JSON.stringify(shops));localStorage.setItem('pika_todo',JSON.stringify(todos));}

function catColor(c){if((c||'').includes('交通'))return'bg-blue-100 text-blue-700';if((c||'').includes('飯店'))return'bg-purple-100 text-purple-700';if((c||'').includes('餐'))return'bg-green-100 text-green-700';if((c||'').includes('景'))return'bg-amber-100 text-amber-800';return'bg-slate-100 text-slate-700';}
function routeText(prev,item){if(!prev||!prev.lat||!item.lat)return'';let dx=(prev.lat-item.lat)*111,dy=(prev.lng-item.lng)*91,km=Math.sqrt(dx*dx+dy*dy);if(km<1.2)return`步行約${Math.max(3,Math.round(km/4.8*60))}分鐘`;return`車程約${Math.max(10,Math.round(km/35*60))}分鐘`;}

function renderItinerary(){let box=document.getElementById('itineraryContainer');let arr=itineraries[currentDay]||[];box.innerHTML='';arr.forEach((item,i)=>{let rt=routeText(arr[i-1],item);if(rt)box.insertAdjacentHTML('beforeend',`<div class="route-chip">➜ ${rt}</div>`);let sub=item.subItems?`<div class="mt-3 space-y-2">${item.subItems.map(s=>`<div class="bg-slate-50 rounded-xl p-3"><b>${s.icon||'✨'} ${s.name}</b><div class="text-xs mt-1">⏰ ${s.openHours||''}　💰 ${s.cost||''}</div><div class="text-xs text-slate-600 mt-1">${s.remarks||''}</div></div>`).join('')}</div>`:'';box.insertAdjacentHTML('beforeend',`<div class="bg-white border-2 border-slate-200 rounded-2xl p-4"><div class="flex justify-between gap-2 flex-wrap"><div class="flex gap-2 items-center flex-wrap"><span class="bg-amber-400 font-black px-3 py-1 rounded-lg text-xs">${item.time}</span><span class="${catColor(item.category)} px-2 py-1 rounded-lg text-xs font-bold">${item.category}</span><h3 class="font-black text-base">${item.name}</h3></div><div class="flex gap-2"><button class="btn-pika text-xs" onclick="moveItem(${i},-1)">↑</button><button class="btn-pika text-xs" onclick="moveItem(${i},1)">↓</button>${item.lat?`<button class="btn-pika text-xs" onclick="openMapLocation(${item.lat},${item.lng},'${item.name.replace(/'/g,'')}')">🗺️ 導航</button>`:''}<button class="btn-pika text-xs" onclick="toggleDetails(this)">詳情</button></div></div><div class="details hidden mt-3 pt-3 border-t text-sm space-y-2"><div>📍 <b>地點：</b>${item.address||'請看行程備註'}</div><div>⏰ <b>時間：</b>${item.openHours||'配合行程'}</div><div>💰 <b>費用：</b>${item.cost||'—'} ${item.costDesc||''}</div><div class="bg-amber-50 rounded-xl p-3">💡 ${item.remarks||''}</div>${sub}</div></div>`);})}function toggleDetails(btn){let d=btn.closest('.bg-white').querySelector('.details');d.classList.toggle('hidden');btn.textContent=d.classList.contains('hidden')?'詳情':'收合';}
function openMapLocation(lat,lng,name){window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,'_blank');}function openFullRoute(){let pins=(itineraries[currentDay]||[]).filter(i=>i.lat&&i.lng);if(!pins.length)return alert('今天沒有座標');let o=`${pins[0].lat},${pins[0].lng}`,d=`${pins[pins.length-1].lat},${pins[pins.length-1].lng}`,w=pins.slice(1,-1).map(p=>`${p.lat},${p.lng}`).join('|');window.open(`https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}${w?'&waypoints='+w:''}`,'_blank');}
function renderShopping(){let sel=document.getElementById('shopCategorySelect'),list=document.getElementById('shopList');sel.innerHTML=shops.map((c,i)=>`<option value="${i}">${c.category}</option>`).join('');list.innerHTML=shops.map((cat,ci)=>`<div class="border-2 border-yellow-100 rounded-2xl overflow-hidden"><div class="flex gap-3 p-3 bg-yellow-50"><img src="${cat.image}" class="w-16 h-14 rounded-xl border"><div><b>${cat.category}</b><div class="text-xs text-slate-500">已買 ${cat.items.filter(x=>x.done).length}/${cat.items.length}</div></div></div>${cat.items.map((it,ii)=>`<div class="p-3 border-t"><div class="flex justify-between gap-2"><label><input type="checkbox" ${it.done?'checked':''} onchange="toggleShop(${ci},${ii})"> <span class="${it.done?'line-through text-slate-400':''}">${it.text}</span></label><button class="text-red-500 text-xs font-bold" onclick="deleteShop(${ci},${ii})">刪除</button></div><div class="mt-2 pl-5"><span class="text-xs font-bold">¥</span> <input type="number" value="${it.price||0}" onchange="updateShopPrice(${ci},${ii},this.value)" class="border rounded-lg px-2 py-1 w-28 text-xs"></div></div>`).join('')}</div>`).join('');}function shopSyncKey(ci,ii,it){return`shop-${ci}-${ii}-${it.text}`;}function syncShop(ci,ii){let it=shops[ci].items[ii],key=shopSyncKey(ci,ii,it);expenses=expenses.filter(e=>e.syncKey!==key);if(it.done&&Number(it.price)>0)expenses.push({date:currentDay,item:'購物｜'+it.text,amount:Number(it.price),category:'購物',syncKey:key});saveAll();renderExpense();updateGlobalWidgets();}function toggleShop(ci,ii){shops[ci].items[ii].done=!shops[ci].items[ii].done;syncShop(ci,ii);saveAll();renderShopping();}function updateShopPrice(ci,ii,v){shops[ci].items[ii].price=Math.max(0,Number(v)||0);if(shops[ci].items[ii].done)syncShop(ci,ii);saveAll();renderShopping();}function addShopItem(){let v=document.getElementById('shopInput').value.trim();if(!v)return;let ci=+document.getElementById('shopCategorySelect').value;shops[ci].items.push({text:v,done:false,price:0});document.getElementById('shopInput').value='';saveAll();renderShopping();}function deleteShop(ci,ii){let it=shops[ci].items[ii],key=shopSyncKey(ci,ii,it);expenses=expenses.filter(e=>e.syncKey!==key);shops[ci].items.splice(ii,1);saveAll();renderShopping();renderExpense();}
const todoCats={before:'🧳 出發前',during:'🚶 旅途中',return:'✈️ 回國前',luggage:'🎒 行李清單'};function renderTodo(){let box=document.getElementById('todoList');box.innerHTML=Object.entries(todoCats).map(([k,label])=>{let arr=todos[k]||[];return`<div class="todo-card"><div class="todo-head">${label}<div class="text-xs text-slate-500 mt-1">完成 ${arr.filter(x=>x.done).length}/${arr.length}</div></div>${arr.map((it,i)=>`<div class="p-3 border-t flex justify-between gap-2"><label><input type="checkbox" ${it.done?'checked':''} onchange="toggleTodo('${k}',${i})"> <span class="${it.done?'line-through text-slate-400':''}">${it.text}</span></label><button class="text-red-500 text-xs font-bold" onclick="deleteTodo('${k}',${i})">刪除</button></div>`).join('')||'<div class="p-3 text-xs text-slate-400">尚無事項</div>'}</div>`;}).join('');updateGlobalWidgets();}function addTodoItem(){let v=document.getElementById('todoInput').value.trim();if(!v)return;let k=document.getElementById('todoCategorySelect').value;todos[k]=todos[k]||[];todos[k].push({text:v,done:false});document.getElementById('todoInput').value='';saveAll();renderTodo();}function toggleTodo(k,i){todos[k][i].done=!todos[k][i].done;saveAll();renderTodo();}function deleteTodo(k,i){todos[k].splice(i,1);saveAll();renderTodo();}
function renderNotes(){document.getElementById('noteBox').value=notes[currentNoteDay]||'';renderDayTabs();}function saveNoteData(){notes[currentNoteDay]=document.getElementById('noteBox').value;saveAll();alert('已儲存備註');}
function renderExpense(){let box=document.getElementById('expenseDayBreakdown'),sum=document.getElementById('expenseSummary');let total=expenses.reduce((a,b)=>a+Number(b.amount||0),0);sum.innerHTML=`<div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 font-black">總花費 ¥${total.toLocaleString()} <span class="ntd-sub">約 ${twd(total)}</span></div>`;box.innerHTML=datesArr.map(d=>{let arr=expenses.filter(e=>e.date===d),st=arr.reduce((a,b)=>a+Number(b.amount||0),0);return`<div class="border rounded-2xl p-4"><h3 class="font-black mb-2">${d}　¥${st.toLocaleString()} <span class="ntd-sub">約 ${twd(st)}</span></h3>${arr.map((e,i)=>`<div class="flex justify-between border-t py-2"><span>${e.item}</span><span class="font-black">¥${Number(e.amount).toLocaleString()} <span class="ntd-sub">約 ${twd(e.amount)}</span> <button class="text-red-500 text-xs ml-2" onclick="deleteExpense('${d}',${i})">刪除</button></span></div>`).join('')||'<div class="text-xs text-slate-400">尚無紀錄</div>'}</div>`;}).join('');updateGlobalWidgets();}function addExpenseItem(){let date=document.getElementById('expDateSelect').value,item=document.getElementById('expNameInput').value.trim(),amount=Number(document.getElementById('expAmtInput').value||0),category=document.getElementById('expCategoryInput').value;if(!item||!amount)return;expenses.push({date,item,amount,category});document.getElementById('expNameInput').value='';document.getElementById('expAmtInput').value='';saveAll();renderExpense();}function deleteExpense(date,idx){let arr=expenses.filter(e=>e.date===date),target=arr[idx];let real=expenses.indexOf(target);if(real>=0)expenses.splice(real,1);saveAll();renderExpense();}
function renderAttractions(){let g=document.getElementById('attractionGrid');g.innerHTML=DATA.attractions.map(a=>`<div class="bg-white border-2 border-yellow-200 rounded-3xl overflow-hidden shadow-sm"><img src="${a.photo}" class="w-full h-48 object-cover" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png';this.className='w-full h-48 object-contain bg-yellow-50'"><div class="p-4 space-y-2"><h3 class="font-black text-xl">${a.title}</h3><p class="text-sm text-slate-700">${a.desc}</p><p class="text-xs text-slate-500">📍 ${a.address}</p><p class="text-xs text-slate-500">⏰ ${a.hours}</p><button class="btn-pika text-xs" onclick="window.open('${a.map}','_blank')">🗺️ 景點導航</button></div></div>`).join('');}
function updateGlobalWidgets(){let total=expenses.reduce((a,b)=>a+Number(b.amount||0),0);document.getElementById('globalWidgetExpense').textContent='¥'+total.toLocaleString();let all=Object.values(todos).flat();document.getElementById('globalWidgetTodo').textContent=all.filter(x=>x.done).length+'/'+all.length;}async function copyCurrentSectionText(){let sec=[...document.querySelectorAll('.main-section')].find(s=>!s.classList.contains('hidden'));let text=(sec?sec.innerText:document.body.innerText).trim();try{await navigator.clipboard.writeText(text);alert('已複製目前分頁文字');}catch(e){alert(text);}}
function renderAll(){renderDayTabs();renderItinerary();renderShopping();renderTodo();renderNotes();renderExpense();renderAttractions();renderWeather();renderTodayHighlight();updateGlobalWidgets();}document.addEventListener('DOMContentLoaded',()=>{setFontMode(localStorage.getItem('fontMode')||'normal');renderAll();});
</script>
</body></html>
