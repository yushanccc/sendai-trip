        .day-tab.active {
            background: #E53935;

            0%, 100% { transform: translateY(0) rotate(0deg); }

        }
        @keyframes pika-wag {
            0%, 100% { transform: rotate(-5deg); }

        .animate-pika-pulse { animation: pika-pulse 2.5s infinite ease-in-out; }

            if (currentItems.length === 0) {

                return;
            }
            const origin = encodeURIComponent(currentItems[0].name);
            const destination = encodeURIComponent(currentItems[currentItems.length - 1].name);
            let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            if (currentItems.length > 2) {
                const waypoints = currentItems.slice(1, -1).map(p => encodeURIComponent(p.name)).join('|');
                url += `&waypoints=${waypoints}`;
            }
            window.open(url, '_blank');
        }

            const todoList = document.getElementById("todoList"); todoList.innerHTML = "";
            todos.forEach((item, idx) => {
                todoList.innerHTML += `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <label class="flex items-center gap-2 cursor-pointer text-sm font-bold ${item.done ? 'line-through text-slate-400' : 'text-slate-700'}">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTodoItem(${idx})" class="w-4 h-4 accent-red-500 rounded">
                        <span>${item.text}</span>
                    </label>
                    <button onclick="deleteTodoItem(${idx})" class="text-xs text-red-500 font-bold">刪除</button>
                </div>`;
            });
            updateGlobalWidgets();
        }
        function addTodoItem() {
            const input = document.getElementById("todoInput"); if (!input.value.trim()) return;
            todos.push({ text: input.value.trim(), done: false }); input.value = "";
            localStorage.setItem("pika_todos", JSON.stringify(todos)); renderTodo();
        }
        function toggleTodoItem(idx) { todos[idx].done = !todos[idx].done; localStorage.setItem("pika_todos", JSON.stringify(todos)); renderTodo(); }
        function deleteTodoItem(idx) { todos.splice(idx, 1); localStorage.setItem("pika_todos", JSON.stringify(todos)); renderTodo(); }

        function renderShopping() {
            const shopList = document.getElementById("shopList"); shopList.innerHTML = "";
            shopItems.forEach((item, idx) => {
                shopList.innerHTML += `<div class="flex items-center justify-between py-2.5 px-1 border-b border-slate-100">
                    <label class="flex items-center gap-2 cursor-pointer text-sm font-medium ${item.done ? 'line-through text-slate-400' : 'text-slate-700'}">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopItem(${idx})" class="w-4 h-4 accent-orange-500 rounded">
                        <span>${item.text}</span>
                    </label>
                    <button onclick="deleteShopItem(${idx})" class="text-xs text-slate-400 font-bold">移除</button>
                </div>`;
            });
        }
        function addShopItem() {
            const input = document.getElementById("shopInput"); if (!input.value.trim()) return;
            shopItems.push({ text: input.value.trim(), done: false }); input.value = "";
            localStorage.setItem("pika_shop", JSON.stringify(shopItems)); renderShopping();
        }
        function toggleShopItem(idx) { shopItems[idx].done = !shopItems[idx].done; localStorage.setItem("pika_shop", JSON.stringify(shopItems)); renderShopping(); }
        function deleteShopItem(idx) { shopItems.splice(idx, 1); localStorage.setItem("pika_shop", JSON.stringify(shopItems)); renderShopping(); }

        let currentNoteDay = "2026/05/21";
        function initNoteTabs() {
            const container = document.getElementById("noteDayTabs"); container.innerHTML = "";
            datesArr.forEach(d => {
                const cls = (d === currentNoteDay) ? 'bg-amber-500 text-white font-bold border-amber-500' : 'bg-slate-100 text-slate-600';
                container.innerHTML += `<button class="px-3 py-1 rounded-full text-xs border ${cls}" onclick="switchNoteDay('${d}')">${d.substring(5)}</button>`;
            });
            document.getElementById("noteCurrentDateDisplay").innerText = currentNoteDay;
            document.getElementById("noteBox").value = notes[currentNoteDay] || "";
        }
        function switchNoteDay(day) { currentNoteDay = day; initNoteTabs(); }
        function saveNoteData() { notes[currentNoteDay] = document.getElementById("noteBox").value; localStorage.setItem("pika_notes", JSON.stringify(notes)); alert("⚡ 備註儲存成功！"); }

        function initExpenseOptions() {
            const select = document.getElementById("expDateSelect"); select.innerHTML = "";
            datesArr.forEach(d => { select.innerHTML += `<option value="${d}">${d}</option>`; });
        }
        function renderExpense() {
            initExpenseOptions();
            const container = document.getElementById("expenseDayBreakdown"); container.innerHTML = "";
            datesArr.forEach(day => {
                const dayExpenses = expenses.filter(e => e.date === day);
                let daySum = dayExpenses.reduce((sum, e) => sum + e.amount, 0);
                let dayHtml = `<div class="bg-slate-50/50 rounded-2xl p-4 border border-slate-100">
                    <div class="flex justify-between items-center border-b pb-1.5 mb-2">
                        <span class="font-bold text-sm text-slate-700">📅 ${day}</span>
                        <span class="text-xs font-black text-amber-600">小計: ¥${daySum.toLocaleString()}</span>
                    </div>`;
                if (dayExpenses.length === 0) { dayHtml += `<p class="text-xs text-slate-400 italic">暫無消費項目</p>`; } 
                else {
                    dayHtml += `<div class="space-y-1.5">`;
                    expenses.forEach((e, globalIdx) => {
                        if (e.date !== day) return;
                        dayHtml += `<div class="flex justify-between items-center bg-white px-3 py-2 rounded-xl border border-slate-100 text-xs">
                            <span class="font-medium text-slate-700">${e.name}</span>
                            <div class="flex items-center gap-3">
                                <span class="font-black text-slate-800">¥${e.amount.toLocaleString()}</span>
                                <button onclick="deleteExpenseItem(${globalIdx})" class="text-red-400 font-bold">✕</button>
                            </div>
                        </div>`;
                    });
                    dayHtml += `</div>`;
                }
                dayHtml += `</div>`; container.innerHTML += dayHtml;
            });
            updateGlobalWidgets();
        }
        function addExpenseItem() {
            const date = document.getElementById("expDateSelect").value;
            const name = document.getElementById("expNameInput").value.trim();
            const amount = parseInt(document.getElementById("expAmtInput").value);
            if (!name || isNaN(amount) || amount <= 0) { alert("請輸入正確的名稱與金額！"); return; }
            expenses.push({ date, name, amount });
            document.getElementById("expNameInput").value = ""; document.getElementById("expAmtInput").value = "";
            localStorage.setItem("pika_expenses", JSON.stringify(expenses)); renderExpense();
        }
        function deleteExpenseItem(idx) { expenses.splice(idx, 1); localStorage.setItem("pika_expenses", JSON.stringify(expenses)); renderExpense(); }

        function renderAttractions() {
            const grid = document.getElementById("attractionGrid"); grid.innerHTML = "";
            attractionsData.forEach(item => {
                grid.innerHTML += `<div class="card bg-white border-2 border-slate-100 p-5 flex flex-col justify-between hover:shadow-md transition-all">
                    <div>
                        <div class="relative bg-gradient-to-br from-amber-100 to-yellow-50 h-40 rounded-2xl border-2 border-slate-900 overflow-hidden flex items-center justify-center mb-2">
                            <div class="absolute top-2 left-3 text-slate-300 font-black text-6xl opacity-30 select-none">${item.bgDecor}</div>
                            <img src="${item.pikaImg}" alt="${item.title}" class="w-24 h-24 object-contain z-10 animate-pika-bounce" />
                            <div class="absolute bottom-2 right-3 bg-slate-900/80 text-yellow-300 text-[11px] px-2.5 py-1 rounded-full font-black border border-yellow-400/50">${item.pikaName}</div>
                        </div>
                        <h3 class="text-lg font-black text-slate-900 mt-2 mb-1">🌟 ${item.title}</h3>
                        <p class="text-xs text-slate-600 mb-3 font-medium leading-relaxed">${item.desc}</p>
                        <div class="bg-white/70 p-3 rounded-xl border border-slate-100 mb-3 text-xs text-slate-700 space-y-1 shadow-sm">
                            <span class="font-black text-slate-900 block text-xs border-b pb-1">✨ 體驗亮點：</span>
                            <div class="leading-relaxed">${item.highlight}</div>
                        </div>
                    </div>
                    <div class="text-[10px] text-slate-500 border-t border-slate-100 pt-2 font-bold">${item.info}</div>
                </div>`;
            });
        }

        window.onload = function() {
            renderItinerary();
            renderShopping();
            renderTodo();
            initNoteTabs();
            renderExpense();
            renderAttractions();
        };
    </script>
</body>
</html>
