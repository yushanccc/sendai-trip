<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡仙台皮卡丘旅行</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SortableJS（拖拉排序） -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <style>
    body {
      background: linear-gradient(to bottom, #fff7b2, #fffdf4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .pikachu-btn {
      background: #ffd93d;
      transition: 0.2s;
    }

    .pikachu-btn:hover {
      transform: scale(1.03);
      background: #ffcb05;
    }

    .tab-active {
      background: #ffcb05;
      font-weight: bold;
    }
  </style>
</head>

<body class="min-h-screen text-gray-800">

<header class="sticky top-0 bg-white/80 backdrop-blur border-b z-50">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-3xl font-black text-yellow-500">⚡仙台旅行</h1>
    <div class="font-bold">2026/5/21 - 5/25</div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

<!-- 行程 -->
<section class="card">
  <h2 class="text-3xl font-black text-yellow-500 mb-4">📅 每日行程</h2>

  <!-- Tabs -->
  <div class="flex gap-2 mb-4 flex-wrap" id="tabs"></div>

  <!-- Day Content -->
  <div id="dayContainer" class="space-y-3"></div>
</section>

<!-- 記帳 -->
<section class="card">
  <h2 class="text-3xl font-black text-yellow-500 mb-6">💰 旅行記帳</h2>

  <div class="grid lg:grid-cols-2 gap-6">

    <div class="space-y-4">
      <input id="name" type="text" placeholder="花費項目" class="w-full border rounded-xl p-3">
      <input id="amount" type="number" placeholder="日圓金額" class="w-full border rounded-xl p-3">

      <select id="category" class="w-full border rounded-xl p-3">
        <option>交通</option>
        <option>餐飲</option>
        <option>購物</option>
        <option>景點</option>
      </select>

      <button onclick="addExpense()" class="pikachu-btn w-full py-3 rounded-xl font-black">
        ➕ 新增花費
      </button>
    </div>

    <div>
      <div id="expenseList" class="space-y-3 mb-6"></div>

      <div class="border-t pt-4 space-y-2 text-lg">
        <div>🇯🇵 日圓總花費：<span id="yenTotal" class="font-black text-orange-600">¥0</span></div>
        <div>🇹🇼 台幣換算：<span id="twdTotal" class="font-black text-red-500">NT$0</span></div>
      </div>
    </div>

  </div>
</section>

</main>

<script>

/* ---------------------------
   匯率
----------------------------*/
let exchangeRate = 0.22;

async function fetchExchangeRate() {
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/JPY");
    const data = await res.json();
    exchangeRate = data.rates.TWD;
    renderExpenses();
  } catch (e) {
    console.log("匯率讀取失敗");
  }
}
fetchExchangeRate();

/* ---------------------------
   記帳資料
----------------------------*/
let expenses = JSON.parse(localStorage.getItem("sendaiExpenses")) || [];

function saveData() {
  localStorage.setItem("sendaiExpenses", JSON.stringify(expenses));
}

function addExpense() {
  const name = document.getElementById("name").value;
  const amount = parseInt(document.getElementById("amount").value);
  const category = document.getElementById("category").value;

  if (!name || !amount) return alert("請輸入完整資訊");

  expenses.push({ name, amount, category });

  saveData();
  renderExpenses();

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
}

function deleteExpense(i) {
  expenses.splice(i, 1);
  saveData();
  renderExpenses();
}

/* ---------------------------
   行程資料（每日分頁）
----------------------------*/
let itineraries = JSON.parse(localStorage.getItem("sendaiPlan")) || {
  "5/21": [
    { name: "抵達仙台", lat: 38.2682, lng: 140.8694 },
    { name: "仙台車站逛街", lat: 38.2607, lng: 140.8821 }
  ],
  "5/22": [
    { name: "松島遊船", lat: 38.3661, lng: 141.0669 }
  ],
  "5/23": [
    { name: "猊鼻渓", lat: 38.9856, lng: 141.2977 }
  ]
};

let currentDay = "5/21";

function savePlan() {
  localStorage.setItem("sendaiPlan", JSON.stringify(itineraries));
}

/* ---------------------------
   Google Maps 導航
----------------------------*/
function openMap(lat, lng) {
  const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=transit`;
  window.open(url, "_blank");
}

/* ---------------------------
   行程 UI
----------------------------*/
function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";

  Object.keys(itineraries).forEach(day => {
    tabs.innerHTML += `
      <button onclick="switchDay('${day}')"
        class="px-4 py-2 rounded-xl ${day === currentDay ? 'tab-active' : 'bg-white'} border">
        ${day}
      </button>
    `;
  });
}

function switchDay(day) {
  currentDay = day;
  renderPlan();
  renderTabs();
}

function renderPlan() {
  const container = document.getElementById("dayContainer");
  container.innerHTML = "";

  itineraries[currentDay].forEach((item, i) => {
    container.innerHTML += `
      <div class="bg-yellow-50 p-4 rounded-2xl flex justify-between items-center cursor-move"
           data-index="${i}">

        <div>
          <div class="font-bold">${item.name}</div>
        </div>

        <button onclick="openMap(${item.lat},${item.lng})"
          class="bg-blue-500 text-white px-3 py-1 rounded-lg">
          🗺 導航
        </button>
      </div>
    `;
  });

  enableDrag();
}

/* ---------------------------
   拖拉排序
----------------------------*/
function enableDrag() {
  const el = document.getElementById("dayContainer");

  new Sortable(el, {
    animation: 150,
    onEnd: function () {
      const newOrder = [];
      el.querySelectorAll("[data-index]").forEach((node) => {
        const i = node.getAttribute("data-index");
        newOrder.push(itineraries[currentDay][i]);
      });

      itineraries[currentDay] = newOrder;
      savePlan();
      renderPlan();
    }
  });
}

/* ---------------------------
   記帳 UI
----------------------------*/
function renderExpenses() {

  const list = document.getElementById("expenseList");
  list.innerHTML = "";

  let total = 0;

  expenses.forEach((item, i) => {
    total += item.amount;

    list.innerHTML += `
      <div class="bg-yellow-50 p-4 rounded-2xl flex justify-between items-center">

        <div>
          <div class="font-bold">${item.name}</div>
          <div class="text-sm text-gray-500">${item.category}</div>
        </div>

        <div class="flex gap-3 items-center">
          <div class="font-black text-orange-600">¥${item.amount}</div>
          <button onclick="deleteExpense(${i})" class="bg-red-400 text-white px-3 py-1 rounded-lg">✕</button>
        </div>

      </div>
    `;
  });

  document.getElementById("yenTotal").innerText =
    "¥" + total.toLocaleString();

  document.getElementById("twdTotal").innerText =
    "NT$" + Math.round(total * exchangeRate).toLocaleString();
}

/* ---------------------------
   初始化
----------------------------*/
renderTabs();
renderPlan();
renderExpenses();

</script>

</body>
</html>
