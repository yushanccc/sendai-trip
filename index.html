                if(day==='5/24') dayOfWeek='(日) 🌳 新綠 • 時尚購物市區漫步';

                    <h2 class="text-2xl font-black text-slate-950 mb-4 pb-2 border-b-2 border-dashed border-slate-950/20 flex items-center gap-2">
                        📅 ${day} ${dayOfWeek}
                    </h2>
                    <div class="sortable-list space-y-4" data-day="${day}">
                        </div>
                `;

                const listContainer = daySection.querySelector('.sortable-list');

                // 填入該日期的卡片
                dayItems.forEach(item => {
                    const card = document.createElement('div');
                    card.id = item.id;
                    card.className = "group bg-white border-2 border-slate-950 rounded-[24px] p-5 shadow-sm hover:shadow-[0_12px_28px_rgba(253,216,53,0.25)] transition-all duration-300 cursor-pointer relative overflow-hidden transform hover:-translate-y-1 active:scale-[0.99]";
                    
                    // 讓整張卡片點擊時觸發打開 Modal 彈窗
                    card.onclick = () => openModal(item);

                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2 flex-wrap">
                                    <div class="bg-slate-900 text-yellow-300 text-[11px] px-2.5 py-1 rounded-full font-black tracking-wide border border-yellow-400/50 backdrop-blur-sm shadow-xs flex items-center gap-1">
                                        <span>${item.pikaEmoji}</span> ${item.pikaName}
                                    </div>
                                    <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-md border border-amber-200">🔍 點擊看詳細資訊</span>
                                </div>
                                
                                <h3 class="text-lg md:text-xl font-black text-slate-950 mb-2 flex items-center gap-1 transition-colors group-hover:text-amber-600">
                                    🌟 ${item.title}
                                </h3>
                                
                                <p class="text-sm text-slate-700 font-medium leading-relaxed mb-4">${item.desc}</p>
                                
                                <div class="bg-amber-50/50 backdrop-blur-xs p-3.5 rounded-xl border border-amber-900/10 mb-3 text-xs text-slate-800 space-y-1.5 shadow-xs">
                                    <span class="font-black text-slate-950 block text-sm flex items-center gap-1 text-amber-700">✨ 必看與體驗亮點：</span>
                                    <div class="leading-relaxed font-medium">${item.highlight}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="text-[11px] text-slate-600 border-t border-slate-900/10 pt-3 mt-2 font-bold leading-relaxed bg-slate-50/80 p-2.5 rounded-xl flex items-center justify-between">
                            <span>📌 ${item.info}</span>
                            <span class="text-amber-600 font-black shrink-0 ml-2 group-hover:translate-x-1 transition-transform">更多細節 ➔</span>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });

                container.appendChild(daySection);

                // 初始化此日期的 Sortable 拖曳排序功能
                new Sortable(listContainer, {
                    animation: 150,
                    ghostClass: 'bg-amber-50',
                    chosenClass: 'border-amber-400',
                    dragClass: 'opacity-50'
                });
            });
        }

        // 切換日期篩選器
        function filterDay(day) {
            currentFilter = day;
            
            // 更新所有按鈕樣式
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.className = "day-btn px-4 py-2 rounded-xl font-black text-sm transition-all duration-200 hover:bg-amber-100 text-slate-700";
            });

            // 啟動當前選中按鈕樣式
            const activeId = day === 'all' ? 'btn-all' : `btn-${day.replace('/', '')}`;
            document.getElementById(activeId).className = "day-btn px-4 py-2 rounded-xl font-black text-sm transition-all duration-200 pikachu-yellow border-2 border-slate-950 shadow-sm";

            // 重新渲染畫面
            renderItinerary();
        }

        // 開啟詳細資訊視窗 (Modal)
        function openModal(item) {
            const modal = document.getElementById('info-modal');
            
            // 填充動態欄位資料
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-pika').innerText = item.pikaEmoji;
            document.getElementById('modal-hours').innerText = item.details.hours || "依現場實際狀況為準";
            document.getElementById('modal-cost').innerText = item.details.cost || "現場自費";
            document.getElementById('modal-notes').innerText = item.details.notes || "暫無額外備註";

            // 顯示動畫處理
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                modal.querySelector('.transform').classList.remove('scale-95');
                modal.querySelector('.transform').classList.add('scale-100');
            }, 10);
        }

        // 關閉詳細資訊視窗
        function closeModal() {
            const modal = document.getElementById('info-modal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        // 點擊彈窗外圍背景自動關閉
        document.getElementById('info-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 網頁加載完畢後自動執行渲染
        window.addEventListener('DOMContentLoaded', () => {
            renderItinerary();
        });
    </script>
</body>
</html>
